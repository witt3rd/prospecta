[package]
name = "prospecta-tui"
version = "0.1.0-dev"
edition = "2021"
description = "Interactive TUI for managing, using, searching, and reviewing prospecta memory banks"
license = "MIT"
repository = "https://github.com/witt3rd/prospecta"
authors = ["Forge ⚒️ <forge@witt3rd.com>"]

[[bin]]
name = "prospecta-tui"
path = "src/main.rs"

[lib]
name = "prospecta_tui"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
color-eyre = "0.6"
dotenvy = "0.15"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
