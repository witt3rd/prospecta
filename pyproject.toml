[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prospecta"
version = "1.0.0"
description = "Long-term memory for agents on Postgres + pgvector: chunk-only writes, native hybrid retrieval, cross-encoder rerank, cited evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Donald Thompson", email = "donald@witt3rd.com" },
]
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "litellm>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "testcontainers[postgres]>=4",
    "litellm>=1.0",
    "openai>=1.0",
]
defaults = [
    "litellm>=1.0",
]
embedder = [
    "sentence-transformers>=2.5",
]
embed-sentence-transformers = [
    "prospecta[embedder]",
]
embed-openai = [
    "openai>=1.0",
]
embed-openai-compatible = [
    "openai>=1.0",
]

[project.scripts]
prospecta = "prospecta.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["prospecta"]
